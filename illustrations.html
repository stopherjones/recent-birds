<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recent Birds — illustrated sightings</title>
<style>
  :root { --paper:#e9e4d6; --ink:#3b3a33; --muted:#7d7a6c; --line:#c9c3b0; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,"Times New Roman",serif;
    display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
  }
  header { text-align:center; padding:28px 16px 4px; flex:none; }
  .kicker { font:500 12px/1 system-ui,sans-serif; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }
  h1 { font-weight:400; font-size:clamp(34px,6vw,56px); margin:12px 0 6px; }
  .sub { font:13px/1.4 system-ui,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

  /* The sheet takes the remaining height and width; the script lays the drawings out to fit it */
  .sheet { position:relative; flex:1; width:min(1200px,96vw); margin:8px auto 0; min-height:240px; }
  .sheet button {
    position:absolute; background:none; border:0; padding:0; cursor:pointer;
    transform:rotate(var(--r)); text-align:center;
  }
  .sheet img {
    display:block; width:100%; height:auto; mix-blend-mode:multiply;
    filter:drop-shadow(0 4px 5px rgba(60,50,30,.12));
    transform:scaleX(var(--flip));
  }

  .sheet button[aria-pressed="true"] img, .sheet button:focus-visible img {
    filter:drop-shadow(0 0 4px rgba(60,50,30,.5)) drop-shadow(0 4px 5px rgba(60,50,30,.12));
  }

  /* Name and link sit at the bottom of the page */
  .caption { flex:none; width:min(1200px,96vw); margin:0 auto; min-height:84px; text-align:center; padding:12px 8px 18px; border-top:1px solid var(--line); }
  .caption .name { font-size:20px; }
  .caption .name a { color:inherit; text-decoration:none; border-bottom:1px dotted var(--muted); }
  .caption .name a:hover { border-bottom-style:solid; }
  .caption .sci { font-style:italic; color:var(--muted); font-size:14px; }
  .caption .meta { font:12px/1.5 system-ui,sans-serif; color:var(--muted); margin-top:4px; }
  .caption .meta b { font-weight:500; color:var(--ink); }
  .caption .hint { font:12px/1.5 system-ui,sans-serif; color:var(--muted); }
  .pager { flex:none; display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap;
    font:13px/1 system-ui,sans-serif; color:var(--muted); padding:6px 8px 0; }
  .pager button { background:none; border:1px solid var(--line); border-radius:999px; padding:6px 12px;
    font:inherit; color:var(--ink); cursor:pointer; }
  .pager button[aria-pressed="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .pager button:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<header>
  <div class="kicker">Local birds</div>
  <h1>Nearby sightings</h1>
  <div class="sub">Your local patch · 10 km · 7 days</div>
</header>

<main class="sheet" id="sheet" aria-live="polite"></main>
<nav class="pager" id="pager" aria-label="Pagination"></nav>
<section class="caption" id="caption"><div class="hint" id="hint">Loading sightings…</div></section>

<script>
// Paths are relative to this page, which sits at the project root. Serve the project
// (GitHub Pages or a local server); browsers block fetch() for files opened straight from disk.
const DATA_URL = 'data/sightings.json';
const IMG_DIR  = 'images/';

// Every species with a drawing is ranked here; paging controls how many show at once.
// Order: no previous sighting first, then the longest gap since the previous sighting
// (absenceDays), then the latest sighting.
const NEW_WINDOW_MS = 2 * 24 * 60 * 60 * 1000;
function isNew(o) { return !!o.firstSeen && (Date.now() - Date.parse(String(o.firstSeen).replace(' ', 'T'))) < NEW_WINDOW_MS; }
function byPriority(a, b) {
  // No previous sighting (absenceDays null) comes first, then the longest gap since the
  // previous sighting, then the most recent sighting.
  const ga = a.absenceDays == null ? Infinity : a.absenceDays;
  const gb = b.absenceDays == null ? Infinity : b.absenceDays;
  if (ga !== gb) return gb > ga ? 1 : -1;
  return String(b.obsDt).localeCompare(String(a.obsDt));
}

const sheet = document.getElementById('sheet');
const caption = document.getElementById('caption');
const hint = document.getElementById('hint');
let items = [];
let active = null;

// Stable pseudo-random number per species, so the layout doesn't reshuffle on reload
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

function drawingExists(code) {
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => resolve(true);
    im.onerror = () => resolve(false);
    im.src = IMG_DIR + code + '.webp';
  });
}

async function load() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('sightings returned ' + res.status);
    const data = await res.json();

    // One entry per species (the job already does this; guard anyway), in priority order
    const seen = new Set();
    const unique = (data.observations || [])
      .filter(o => o.speciesCode)
      .slice().sort(byPriority)
      .filter(o => !seen.has(o.speciesCode) && seen.add(o.speciesCode));

    // Keep every species that has a drawing; paging decides how many show at once
    const checks = await Promise.all(unique.map(async o => (await drawingExists(o.speciesCode)) ? o : null));
    allItems = checks.filter(Boolean);
    render();

    hint.textContent = allItems.length
      ? 'Tap a bird to see its name and where it was seen'
      : 'No drawings yet for these sightings';
  } catch (e) {
    hint.textContent = 'Could not load sightings: ' + e.message;
  }
}

// Seeded random numbers, so each species always gets the same place for the same window size
function rng(seed) {
  let x = seed || 1;
  return () => { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; };
}

// Hex layout: birds sit on a hexagonal grid (alternate rows offset by half a cell),
// so they nest like tiles. Each bird is varied in size, tilt and position a little
// so the sheet still looks hand-placed.
function layout() {
  sheet.innerHTML = '';
  const n = items.length;
  if (!n) return;
  const W = sheet.clientWidth, H = sheet.clientHeight;
  if (!W || !H) return;

  const ROW = Math.sqrt(3) / 2;                    // vertical spacing of a hex grid, in cell widths
  // Pick the row count that makes the grid cell (d) largest for this window
  let best = { d: 0, rows: 1, cols: n };
  for (let rows = 1; rows <= n; rows++) {
    const cols = Math.ceil(n / rows);
    const d = Math.min(W / (cols + 0.5), H / ((rows - 1) * ROW + 1));
    if (d > best.d) best = { d, rows, cols };
  }
  const { d, rows, cols } = best;
  const gridW = (cols + 0.5) * d, gridH = ((rows - 1) * ROW + 1) * d;
  const x0 = (W - gridW) / 2, y0 = (H - gridH) / 2;

  items.forEach((o, i) => {
    const h = hash(o.speciesCode);
    const rand = rng(h);
    const row = Math.floor(i / cols);
    const k = i % cols;
    const rowCount = Math.min(cols, n - row * cols);
    const shift = (row % 2) * d / 2;               // offset alternate rows
    const centreRow = (cols - rowCount) * d / 2;   // centre a short last row
    // Size varies around the cell; the first few (newest / longest absent) a little larger
    const w = d * (i < 3 ? 1.02 : 0.9) * (0.9 + rand() * 0.15);
    const cx = x0 + (k + 0.5) * d + shift + centreRow + (rand() - 0.5) * d * 0.16;
    const cy = y0 + d / 2 + row * ROW * d + (rand() - 0.5) * d * 0.16;
    const r = (rand() * 14) - 7;                   // tilt, degrees
    const flip = rand() < 0.5 ? -1 : 1;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-label', o.comName || o.speciesCode);
    btn.setAttribute('aria-pressed', 'false');
    btn.style.left = (cx - w / 2) + 'px';
    btn.style.top = (cy - w * 0.6) + 'px';         // drawings are about 1.2 times as tall as wide
    btn.style.width = w + 'px';
    btn.style.setProperty('--r', r + 'deg');
    btn.style.setProperty('--flip', flip);
    btn.style.zIndex = i;

    const img = document.createElement('img');
    img.src = IMG_DIR + o.speciesCode + '.webp';
    img.alt = '';
    btn.append(img);
    btn.onclick = () => show(o, btn);
    sheet.append(btn);
  });
}

function show(o, btn) {
  if (active) active.setAttribute('aria-pressed', 'false');
  active = btn;
  btn.setAttribute('aria-pressed', 'true');
  const when = o.obsDt ? new Date(o.obsDt.replace(' ', 'T')).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  caption.innerHTML =
    `<div class="name"></div><div class="sci"></div><div class="meta"><b></b> · <span></span></div>`;
  const link = document.createElement('a');
  link.href = 'https://ebird.org/species/' + encodeURIComponent(o.speciesCode);
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = o.comName || '';
  caption.querySelector('.name').append(link);
  caption.querySelector('.sci').textContent = o.sciName || '';
  caption.querySelector('.meta b').textContent = (o.locName || '').split(',')[0].trim();
  caption.querySelector('.meta span').textContent = when + (isNew(o) ? ' · new' : '');
}

// Paging: 12, 24 or all birds per page
let allItems = [];
let page = 0;
let pageSize = 24;                                  // 12, 24 or 'all'

function sizeNow() { return pageSize === 'all' ? Math.max(1, allItems.length) : pageSize; }
function pageCount() { return Math.max(1, Math.ceil(allItems.length / sizeNow())); }

function render() {
  page = Math.min(page, pageCount() - 1);
  const start = page * sizeNow();
  items = allItems.slice(start, start + sizeNow());
  active = null;
  layout();
  renderPager();
}

function renderPager() {
  const nav = document.getElementById('pager');
  const total = pageCount();
  nav.innerHTML = '';
  const add = (label, onClick, { pressed, disabled } = {}) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.onclick = onClick;
    if (pressed !== undefined) b.setAttribute('aria-pressed', String(pressed));
    if (disabled) b.disabled = true;
    nav.append(b);
  };
  add('‹ Prev', () => { page--; render(); }, { disabled: page === 0 });
  for (const size of [12, 24, 'all']) {
    add(size === 'all' ? 'All' : String(size), () => { pageSize = size; page = 0; render(); },
        { pressed: pageSize === size });
  }
  add('Next ›', () => { page++; render(); }, { disabled: page >= total - 1 });
  const info = document.createElement('span');
  info.textContent = `Page ${page + 1} of ${total}`;
  nav.append(info);
}

// Re-layout when the window changes shape (rotation, resize)
let resizeTimer;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layout, 120);
}).observe(sheet);

load();
</script>
</body>
</html>
