<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recent Birds — illustrated sightings</title>
<style>
  :root { --paper:#e9e4d6; --ink:#3b3a33; --muted:#7d7a6c; --line:#c9c3b0; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,"Times New Roman",serif;
    display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
  }
  header { text-align:center; padding:28px 16px 4px; flex:none; }
  .kicker { font:500 12px/1 system-ui,sans-serif; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }
  h1 { font-weight:400; font-size:clamp(34px,6vw,56px); margin:12px 0 6px; }
  .sub { font:13px/1.4 system-ui,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

  /* The sheet takes the remaining height and width; the script lays the drawings out to fit it */
  .sheet { position:relative; flex:1; width:min(1200px,96vw); margin:8px auto 0; min-height:240px; }
  .sheet button {
    position:absolute; background:none; border:0; padding:0; cursor:pointer;
    transform:rotate(var(--r)); text-align:center;
  }
  .sheet img {
    display:block; width:100%; height:auto; mix-blend-mode:multiply;
    filter:drop-shadow(0 4px 5px rgba(60,50,30,.12));
    transform:scaleX(var(--flip));
  }

  .sheet button[aria-pressed="true"] img, .sheet button:focus-visible img {
    filter:drop-shadow(0 0 4px rgba(60,50,30,.5)) drop-shadow(0 4px 5px rgba(60,50,30,.12));
  }

  /* Name and link sit at the bottom of the page */
  .caption { flex:none; width:min(1200px,96vw); margin:0 auto; min-height:84px; text-align:center; padding:12px 8px 18px; border-top:1px solid var(--line); }
  .caption .name { font-size:20px; }
  .caption .name a { color:inherit; text-decoration:none; border-bottom:1px dotted var(--muted); }
  .caption .name a:hover { border-bottom-style:solid; }
  .caption .sci { font-style:italic; color:var(--muted); font-size:14px; }
  .caption .meta { font:12px/1.5 system-ui,sans-serif; color:var(--muted); margin-top:4px; }
  .caption .meta b { font-weight:500; color:var(--ink); }
  .caption .hint { font:12px/1.5 system-ui,sans-serif; color:var(--muted); }
  .pager { flex:none; display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap;
    font:13px/1 system-ui,sans-serif; color:var(--muted); padding:6px 8px 0; }
  .pager button { background:none; border:1px solid var(--line); border-radius:999px; padding:6px 12px;
    font:inherit; color:var(--ink); cursor:pointer; }
  .pager button[aria-pressed="true"] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .pager button:disabled { opacity:.4; cursor:default; }
  .sheet button { transform:none; }
  .sheet img { transform:none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Local birds</div>
  <h1>Nearby sightings</h1>
  <div class="sub">Your local patch · 10 km · 7 days</div>
</header>

<main class="sheet" id="sheet" aria-live="polite"></main>
<nav class="pager" id="pager" aria-label="Pagination"></nav>
<section class="caption" id="caption"><div class="hint" id="hint">Loading sightings…</div></section>

<script>
// Paths are relative to this page, which sits at the project root. Serve the project.
const DATA_URL  = 'data/sightings.json';
const MASKS_URL = 'data/masks.json';
const IMG_DIR   = 'images/';
const GRID_STRIDE = 4;     // viewport px per occupancy cell (smaller = finer, slower)
const PAD = 3;             // grid cells of breathing room around each bird
const ELLIPSE_WIDE = 2.1;  // landscape screens: cluster spreads sideways
const ELLIPSE_TALL = 1.7;  // narrow screens: cluster spreads vertically

const NEW_WINDOW_MS = 2 * 24 * 60 * 60 * 1000;   // unused by ordering, kept for the caption
const sheet = document.getElementById('sheet');
const caption = document.getElementById('caption');
const hint = document.getElementById('hint');

let masksTable = {};
const maskCache = {};
let allItems = [];
let items = [];
let pageNo = 0;
let pageSizeSel = 24;                // 12 or 24
let active = null;

// Ordering (same as the other page): no previous sighting first, then the longest gap
// since the previous sighting, then the most recent sighting.
function byPriority(a, b) {
  const ga = a.absenceDays == null ? Infinity : a.absenceDays;
  const gb = b.absenceDays == null ? Infinity : b.absenceDays;
  if (ga !== gb) return gb > ga ? 1 : -1;
  return String(b.obsDt).localeCompare(String(a.obsDt));
}
function isNew(o) {
  return !!o.firstSeen && (Date.now() - Date.parse(String(o.firstSeen).replace(' ', 'T'))) < NEW_WINDOW_MS;
}

// Decode a 1-bit MSB-first mask into a sparse list of filled cells (same as apt.js loadMask)
function getMask(code) {
  if (maskCache[code]) return maskCache[code];
  const rec = masksTable[code];
  if (!rec) return null;
  const bytes = atob(rec.bits);
  const cells = [];
  for (let y = 0; y < rec.h; y++) {
    for (let x = 0; x < rec.w; x++) {
      const i = y * rec.w + x;
      if ((bytes.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1) cells.push([x, y]);
    }
  }
  return (maskCache[code] = { w: rec.w, h: rec.h, cells });
}

async function load() {
  try {
    const [sRes, mRes] = await Promise.all([
      fetch(DATA_URL, { cache: 'no-cache' }),
      fetch(MASKS_URL, { cache: 'no-cache' }),
    ]);
    if (!sRes.ok) throw new Error('sightings returned ' + sRes.status);
    if (!mRes.ok) throw new Error('masks returned ' + mRes.status + ' (run scripts/build_masks.py)');
    const data = await sRes.json();
    masksTable = await mRes.json();

    // One entry per species, in priority order, keeping only those with a silhouette
    const seen = new Set();
    allItems = (data.observations || [])
      .filter(o => o.speciesCode && masksTable[o.speciesCode])
      .slice().sort(byPriority)
      .filter(o => !seen.has(o.speciesCode) && seen.add(o.speciesCode));
    render();
    hint.textContent = allItems.length
      ? 'Tap a bird to see its name and where it was seen'
      : 'No silhouettes yet for these sightings';
  } catch (e) {
    hint.textContent = 'Could not load: ' + e.message;
  }
}

// ---- Paging (12 / 24 / all) ----
function sizeNow() { return pageSizeSel; }
function pageCount() { return Math.max(1, Math.ceil(allItems.length / sizeNow())); }
function render() {
  pageNo = Math.min(pageNo, pageCount() - 1);
  const start = pageNo * sizeNow();
  items = allItems.slice(start, start + sizeNow());
  active = null;
  layout();
  renderPager();
}
function renderPager() {
  const nav = document.getElementById('pager');
  const total = pageCount();
  nav.innerHTML = '';
  const add = (label, onClick, { pressed, disabled } = {}) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.onclick = onClick;
    if (pressed !== undefined) b.setAttribute('aria-pressed', String(pressed));
    if (disabled) b.disabled = true;
    nav.append(b);
  };
  add('‹ Prev', () => { pageNo--; render(); }, { disabled: pageNo === 0 });
  for (const size of [12, 24]) {
    add(String(size), () => { pageSizeSel = size; pageNo = 0; render(); },
        { pressed: pageSizeSel === size });
  }
  add('Next ›', () => { pageNo++; render(); }, { disabled: pageNo >= total - 1 });
  const info = document.createElement('span');
  info.textContent = `Page ${pageNo + 1} of ${total}`;
  nav.append(info);
}

// ---- Silhouette packing (after apt.js maskPack, without label boxes) ----
function maskPack(tiles, W, H, xBias, yBias, pad) {
  const GW = Math.ceil(W / GRID_STRIDE) + 2;
  const GH = Math.ceil(H / GRID_STRIDE) + 2;
  const grid = new Uint8Array(GW * GH);

  function cellRange(t, tx, ty, c) {
    const sx = t.fullW / t.mask.w, sy = t.fullH / t.mask.h;
    let x0 = Math.floor((tx + c[0] * sx) / GRID_STRIDE);
    let y0 = Math.floor((ty + c[1] * sy) / GRID_STRIDE);
    let x1 = Math.floor((tx + (c[0] + 1) * sx) / GRID_STRIDE);
    let y1 = Math.floor((ty + (c[1] + 1) * sy) / GRID_STRIDE);
    if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0;
    if (x1 >= GW) x1 = GW - 1; if (y1 >= GH) y1 = GH - 1;
    return [x0, y0, x1, y1];
  }
  function collides(t, tx, ty) {
    const cells = t.mask.cells;
    for (let i = 0; i < cells.length; i++) {
      const r = cellRange(t, tx, ty, cells[i]);
      for (let gy = r[1]; gy <= r[3]; gy++) {
        const off = gy * GW;
        for (let gx = r[0]; gx <= r[2]; gx++) if (grid[off + gx]) return true;
      }
    }
    return false;
  }
  function stamp(t, tx, ty) {
    const cells = t.mask.cells;
    for (let i = 0; i < cells.length; i++) {
      const r = cellRange(t, tx, ty, cells[i]);
      // Dilate by `pad` so neighbours keep an even gap; collides() stays unpadded
      let gy0 = Math.max(0, r[1] - pad), gy1 = Math.min(GH - 1, r[3] + pad);
      let gx0 = Math.max(0, r[0] - pad), gx1 = Math.min(GW - 1, r[2] + pad);
      for (let gy = gy0; gy <= gy1; gy++) {
        const off = gy * GW;
        for (let gx = gx0; gx <= gx1; gx++) grid[off + gx] = 1;
      }
    }
  }
  function offGrid(t, tx, ty) {
    return tx < 0 || ty < 0 || tx + t.fullW > W || ty + t.fullH > H;
  }

  const cx = W / 2, cy = H / 2;
  tiles.sort((a, b) => (b.fullW * b.fullH) - (a.fullW * a.fullH));
  const placed = [];
  let seed = 0x9E3779B9;                       // seeded so the layout is stable across resizes
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

  for (let i = 0; i < tiles.length; i++) {
    const t = tiles[i];
    if (i === 0) {
      t.x = cx - t.fullW / 2; t.y = cy - t.fullH / 2;
      stamp(t, t.x, t.y); placed.push(t);
      continue;
    }
    // Centre of mass of what is placed, so the cluster grows around itself
    let comX = 0, comY = 0, comW = 0;
    placed.forEach(p => {
      if (p.x < -1000) return;
      const a = p.fullW * p.fullH;
      comX += (p.x + p.fullW / 2) * a; comY += (p.y + p.fullH / 2) * a; comW += a;
    });
    if (comW) { comX /= comW; comY /= comW; } else { comX = cx; comY = cy; }

    let best = null, bestCost = Infinity, foundRing = -1;
    const step = Math.max(GRID_STRIDE, Math.min(t.fullW, t.fullH) * 0.05);
    const maxR = Math.max(W, H);
    const phase = rand() * Math.PI * 2;
    for (let r = 0; r <= maxR; r += step) {
      if (foundRing >= 0 && r > foundRing + step * 2) break;
      const samples = Math.max(36, Math.floor(r / 1.6));
      for (let k = 0; k < samples; k++) {
        const theta = phase + (k / samples) * Math.PI * 2;
        const px = cx + r * xBias * Math.cos(theta) - t.fullW / 2;
        const py = cy + r * yBias * Math.sin(theta) - t.fullH / 2;
        if (offGrid(t, px, py)) continue;
        if (collides(t, px, py)) continue;
        const dxx = px + t.fullW / 2 - comX, dyy = py + t.fullH / 2 - comY;
        const cost = Math.hypot(dxx / xBias, dyy / yBias) + rand() * step * 0.5;
        if (cost < bestCost) { bestCost = cost; best = { x: px, y: py }; }
      }
      if (best && foundRing < 0) foundRing = r;
    }
    if (best) {
      t.x = best.x; t.y = best.y; stamp(t, best.x, best.y); placed.push(t);
    } else {
      t.x = -99999; t.y = -99999; placed.push(t);          // no room: left off the sheet
    }
  }
  return placed;
}

function layout() {
  sheet.innerHTML = '';
  const n = items.length;
  if (!n) return;
  const W = sheet.clientWidth, H = sheet.clientHeight;
  if (!W || !H) return;

  const narrow = W <= 700;
  const frac = n <= 4 ? 0.46 : n <= 12 ? 0.40 : n <= 24 ? 0.34 : 0.28;   // share of the sheet to fill
  const minFrac = n <= 8 ? 0.01 : n <= 20 ? 0.0075 : 0.0055;
  const vpArea = W * H, budget = vpArea * frac, minArea = vpArea * minFrac;

  // Earlier in the ranking = larger; the scale runs from 3x down to 1x
  const tiles = items.map((o, i) => ({
    o, mask: getMask(o.speciesCode),
    score: 1 + 2 * (n - 1 - i) / Math.max(1, n - 1),
  }));
  const sum = tiles.reduce((a, t) => a + t.score, 0);
  tiles.forEach(t => {
    t.mask = t.mask;
    t.ar = t.mask.w / t.mask.h;
    t.area = Math.max(minArea, budget * t.score / sum);
    t.fullW = Math.sqrt(t.area * t.ar);
    t.fullH = t.fullW / t.ar;
  });

  const xBias = narrow ? 1 : ELLIPSE_WIDE;
  const yBias = narrow ? ELLIPSE_TALL : 1;
  const pad = narrow ? Math.max(1, PAD - 1) : PAD;

  // Pack, then shrink and repack until every bird is on the sheet (up to 10 rounds)
  let placed = [];
  for (let attempt = 0; attempt < 10; attempt++) {
    placed = maskPack(tiles, W, H, xBias, yBias, pad);
    const off = placed.some(t => t.x < -1000 || t.x < 0 || t.y < 0 ||
                                 t.x + t.fullW > W || t.y + t.fullH > H);
    if (!off) break;
    tiles.forEach(t => { t.fullW *= 0.92; t.fullH *= 0.92; });
  }

  // Centre the cluster on the sheet
  const visible = placed.filter(t => t.x > -1000);
  if (visible.length) {
    const minX = Math.min(...visible.map(t => t.x)), maxX = Math.max(...visible.map(t => t.x + t.fullW));
    const minY = Math.min(...visible.map(t => t.y)), maxY = Math.max(...visible.map(t => t.y + t.fullH));
    const dx = (W - (maxX - minX)) / 2 - minX, dy = (H - (maxY - minY)) / 2 - minY;
    visible.forEach(t => { t.x += dx; t.y += dy; });
  }

  placed.forEach((t, i) => {
    if (t.x < -1000) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-label', t.o.comName || t.o.speciesCode);
    btn.setAttribute('aria-pressed', 'false');
    btn.style.left = t.x + 'px';
    btn.style.top = t.y + 'px';
    btn.style.width = t.fullW + 'px';
    btn.style.zIndex = i;
    const img = document.createElement('img');
    img.src = IMG_DIR + t.o.speciesCode + '.webp';
    img.alt = '';
    btn.append(img);
    btn.onclick = () => show(t.o, btn);
    sheet.append(btn);
  });
}

function show(o, btn) {
  if (active) active.setAttribute('aria-pressed', 'false');
  active = btn;
  btn.setAttribute('aria-pressed', 'true');
  const when = o.obsDt ? new Date(o.obsDt.replace(' ', 'T')).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  caption.innerHTML =
    `<div class="name"></div><div class="sci"></div><div class="meta"><b></b> · <span></span></div>`;
  const link = document.createElement('a');
  link.href = 'https://ebird.org/species/' + encodeURIComponent(o.speciesCode);
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = o.comName || '';
  caption.querySelector('.name').append(link);
  caption.querySelector('.sci').textContent = o.sciName || '';
  caption.querySelector('.meta b').textContent = (o.locName || '').split(',')[0].trim();
  caption.querySelector('.meta span').textContent = when + (isNew(o) ? ' · new' : '');
}

let resizeTimer;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layout, 120);
}).observe(sheet);

load();
</script>
</body>
</html>
