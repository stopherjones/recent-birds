name: Refresh bird sightings

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch sightings and photos
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          EBIRD_LAT: ${{ secrets.EBIRD_LAT }}
          EBIRD_LNG: ${{ secrets.EBIRD_LNG }}
        run: node scripts/fetch-sightings.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh sightings $(date -u +%F)"
            git push
          fi