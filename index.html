<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e9e5d9"><title>Birds Around Me — Heard Today</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body><main class="shell">
<div class="toolbar"><div class="controls"><button id="locate" class="primary">Find birds near me</button></div></div>
<section class="poster" aria-label="Bird sightings poster">
<header class="mast"><div class="eyebrow">Local birds</div><h1>Nearby sightings</h1><div class="sub" id="place">Sightings within 10km over the last 7 days</div></header>
<div class="rule"></div><div class="summary" id="summary">A small record of the birds recently reported nearby</div>
<section class="birds" id="birds"><div class="empty">Your local bird list will appear here.<br>Choose <b>Find birds near me</b> and allow location access.</div></section>
<footer class="footer"><span id="count">Awaiting observations</span><span id="updated">eBird · Recent nearby observations</span></footer>
</section>
<div class="status" id="status" role="status" aria-live="polite"></div>
<input id="worker" type="hidden" value="https://ebird-api.chrisjones59.workers.dev">
</main>
<script src="js/app.js"></script>
</body>
</html>
