<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e9e5d9"><title>Birds Near Me</title>
<link rel="icon" href="favicon.jpg" type="image/jpg">
<link rel="stylesheet" href="css/style.css">
<style>[hidden]{display:none!important}</style>
</head>
<body><main class="shell">
<div class="toolbar"><div class="controls"><button id="locate" class="primary">Find birds near me</button><button id="inat" class="primary">Find nature on iNaturalist</button><button id="share" class="primary" hidden>Share these results</button><a id="liveLink" href="./" hidden>See live sightings near you</a></div></div>
<section class="poster" aria-label="Bird sightings poster">
<header class="mast"><h1>Nearby sightings</h1></header>
<div class="rule"></div><div class="summary" id="summary">A small record of the birds recently reported nearby</div>
<section class="birds" id="birds"><div class="empty">Your local bird list will appear here.<br>Choose <b>Find birds near me</b> and allow location access.</div></section>
<nav class="pager" id="pager" aria-label="Pagination"></nav>
<footer class="footer"><span id="count">Awaiting observations</span><span id="updated">eBird · Recent nearby observations</span></footer>
</section>
<div class="status" id="status" role="status" aria-live="polite"></div>
<input id="worker" type="hidden" value="https://ebird-api.chrisjones59.workers.dev">
</main>
<script src="js/app.js?v=inat3"></script>
<script src="js/inat.js?v=inat3"></script>
</body>
</html>
